name: "X-Wing Alliance Upgrade 2025 (XWAU2025)"
game_slug: xwau2025
version: "1.0"
slug: xwau2025
runner: wine

script:
  requires: xwa-installer-manager

  files:
    - xwau_exe: "N/A:Select Alliance.exe inside the XWAU2025 folder you created with XwaInstallerManager"
    - seed_prefix_marker: "N/A:Select the file named system.reg inside the Wine prefix used by your XWA Mod Installer Manager entry (Lutris: right-click that entry -> Configure -> Advanced -> Wine prefix, then browse to system.reg inside it)"
    - linux_patch_zip: https://github.com/morallo/xwa_ddraw_d3d11/releases/download/20260808_linux/XWAU2025_Linux.zip

  installer:
    # Clones the prefix set up by 01-xwainstallermanager.yml (fonts, DPI,
    # etc. already configured there) instead of reinstalling everything
    # from scratch. $GAMEDIR is already a fresh empty directory at this
    # point, so this is safe as the very first step.
    - execute:
        description: Cloning your XWA Mod Installer Manager prefix
        command: 'cp -a "$(dirname "$seed_prefix_marker")/." "$GAMEDIR/"'

    - extract:
        file: linux_patch_zip
        dst: $GAMEDIR/xwau_linux_patch

    # If XWAU2025_Linux.zip contains a single wrapping top-level folder
    # instead of the files directly, adjust the source path below to
    # match (e.g. "$GAMEDIR/xwau_linux_patch/<folder-name>/.").
    - execute:
        description: Copying the Linux DLL wrapper into your XWAU2025 folder
        command: 'cp -rf "$GAMEDIR/xwau_linux_patch/." "$(dirname "$xwau_exe")/"'

  game:
    exe: $xwau_exe
    prefix: $GAMEDIR
    arch: win64

  wine:
    overrides:
      ddraw.dll: n,b
      dinput.dll: n,b
