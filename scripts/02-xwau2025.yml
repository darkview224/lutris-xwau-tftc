name: "X-Wing Alliance Upgrade 2025 (XWAU2025)"
game_slug: xwau2025
version: "1.0"
slug: xwau2025
runner: wine

# Adjust this to match the game_slug of your own installed vanilla X-Wing
# Alliance (GOG) Lutris entry if it differs from the public lutris.net slug.
script:
  requires: star-wars-x-wing-alliance

  files:
    - xwa_exe: "N/A:Select Alliance.exe (or XWINGALLIANCE.EXE) inside your vanilla X-Wing Alliance install"
    - xwau_full_zip: "N/A:Select XWAU2025_Full_1.0.0.zip, downloaded from https://www.xwaupgrade.com/ (or copied out of XwaInstallerManager's InstallerPackages folder if you already ran it)"
    - xwau_upd_zip: "N/A:Select XWAU2025_UPD_1.1.0.zip, downloaded the same way"
    - linux_patch_zip: https://github.com/morallo/xwa_ddraw_d3d11/releases/download/20260808_linux/XWAU2025_Linux.zip

  installer:
    # This script builds XWAU2025 itself instead of depending on
    # 01-xwa-mod-manager.yml having built it - see docs/DESIGN-NOTES.md.
    # First, locate and clone the Wine prefix vanilla XWA actually runs in
    # (found by walking up from the picked exe to its enclosing drive_c),
    # for the same reason 02/03 always have: one shared, tested prefix
    # instead of rebuilding fonts/DPI/Gecko/Mono from scratch. Unlike
    # 01-xwa-mod-manager.yml's cosmetic use of this same trick, failure
    # here is fatal - there's no prefix to build XWAU2025 in without it.
    - execute:
        description: Cloning your vanilla XWA prefix
        command: >-
          prefix_dir="$(dirname "$xwa_exe")";
          while [ "$prefix_dir" != "/" ] && [ "$(basename "$prefix_dir")" != "drive_c" ]; do prefix_dir="$(dirname "$prefix_dir")"; done;
          if [ "$(basename "$prefix_dir")" != "drive_c" ]; then echo "Could not find a drive_c folder above the selected exe - is it really installed in a Wine prefix?" >&2; exit 1; fi;
          prefix_root="$(dirname "$prefix_dir")";
          if [ "$prefix_root" != "$GAMEDIR" ]; then cp -a "$prefix_root/." "$GAMEDIR/"; fi

    - task:
        name: winetricks
        prefix: $GAMEDIR
        app: corefonts consolas

    # Build a fresh XWAU2025 folder from a copy of your vanilla game files,
    # matching how XwaInstallerManager itself works (a copy, not the same
    # folder as vanilla) - see docs/DESIGN-NOTES.md.
    - execute:
        description: Copying your vanilla X-Wing Alliance files into a new XWAU2025 folder
        command: >-
          mkdir -p "$GAMEDIR/drive_c/XWAU2025";
          cp -a "$(dirname "$xwa_exe")/." "$GAMEDIR/drive_c/XWAU2025/"

    - extract:
        file: xwau_full_zip
        dst: $GAMEDIR/xwau_full_extracted

    # NOTE: assumes XWAU2025_Full_1.0.0.zip extracts as a flat file set. If
    # it contains a single wrapping top-level folder instead, adjust the
    # source path below to match.
    - execute:
        description: Installing XWAU2025 1.0.0 into your new XWAU2025 folder
        command: 'cp -rf "$GAMEDIR/xwau_full_extracted/." "$GAMEDIR/drive_c/XWAU2025/"'

    - extract:
        file: xwau_upd_zip
        dst: $GAMEDIR/xwau_upd_extracted

    # Same flat-file-set assumption as the Full 1.0.0 zip above.
    - execute:
        description: Applying the XWAU2025 1.1.0 update
        command: 'cp -rf "$GAMEDIR/xwau_upd_extracted/." "$GAMEDIR/drive_c/XWAU2025/"'

    - extract:
        file: linux_patch_zip
        dst: $GAMEDIR/xwau_linux_patch

    # Confirmed: XWAU2025_Linux.zip extracts as a flat file set (plus one
    # XwaInstallerRunner/ subfolder, fine to copy alongside it). Applied
    # last so its Alliance.EXE (confirmed filename) is the one XWAU2025
    # actually launches.
    - execute:
        description: Copying the Linux DLL wrapper into your XWAU2025 folder
        command: 'cp -rf "$GAMEDIR/xwau_linux_patch/." "$GAMEDIR/drive_c/XWAU2025/"'

  # Hardcoded, not picked - see docs/DESIGN-NOTES.md for why this script
  # can't use a file-picker for its own exe. NOTE: unverified whether
  # Lutris/Wine's launch path resolves this case-insensitively if your
  # filesystem ends up with different casing - confirm on first real run.
  game:
    exe: $GAMEDIR/drive_c/XWAU2025/Alliance.EXE
    prefix: $GAMEDIR
    arch: win64

  wine:
    overrides:
      ddraw.dll: n,b
      dinput.dll: n,b
