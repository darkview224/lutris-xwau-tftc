name: "TIE Fighter Total Conversion (TFTC)"
game_slug: tftc
version: "1.0"
slug: tftc
runner: wine

script:
  requires: xwa-mod-manager

  files:
    # NOTE: verify the actual executable name TFTC uses on first run -
    # it may not be Alliance.exe. Adjust the prompt text/expectation below
    # if it differs.
    - tftc_exe: "N/A:Select the game executable (e.g. Alliance.exe) inside the TFTC folder you created with XwaInstallerManager"
    - seed_prefix_marker: "N/A:Select the file named system.reg inside the Wine prefix used by your XWA Mod Installer Manager entry (Lutris: right-click that entry -> Configure -> Advanced -> Wine prefix, then browse to system.reg inside it)"
    - linux_patch_zip: https://github.com/morallo/xwa_ddraw_d3d11/releases/download/20260808_linux/XWAU2025_Linux.zip

  installer:
    # Clones the prefix set up by 01-xwa-mod-manager.yml (fonts, DPI,
    # etc. already configured there) instead of reinstalling everything
    # from scratch. Skipped if the selected system.reg already lives in
    # $GAMEDIR (e.g. you pointed this install at the same folder as the
    # manager entry) - cp refuses to copy a directory onto itself.
    - execute:
        description: Cloning your XWA Mod Installer Manager prefix
        command: >-
          src="$(dirname "$seed_prefix_marker")";
          if [ "$src" != "$GAMEDIR" ]; then cp -a "$src/." "$GAMEDIR/"; fi

    - extract:
        file: linux_patch_zip
        dst: $GAMEDIR/tftc_linux_patch

    # TFTC is confirmed to reuse the same Linux DLL wrapper as XWAU2025,
    # which extracts as a flat file set (plus one XwaInstallerRunner/
    # subfolder, fine to copy alongside it).
    - execute:
        description: Copying the Linux DLL wrapper into your TFTC folder
        command: 'cp -rf "$GAMEDIR/tftc_linux_patch/." "$(dirname "$tftc_exe")/"'

  game:
    exe: $tftc_exe
    prefix: $GAMEDIR
    arch: win64

  wine:
    overrides:
      ddraw.dll: n,b
      dinput.dll: n,b
