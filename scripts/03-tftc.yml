name: "TIE Fighter Total Conversion (TFTC)"
game_slug: tftc
version: "1.0"
slug: tftc
runner: wine

script:
  requires: xwa-installer-manager

  files:
    # NOTE: verify the actual executable name TFTC uses on first run —
    # it may not be Alliance.exe. Adjust the prompt text/expectation below
    # if it differs.
    - tftc_exe: "N/A:Select the game executable (e.g. Alliance.exe) inside the TFTC folder you created with XwaInstallerManager"
    - linux_patch_zip: https://github.com/morallo/xwa_ddraw_d3d11/releases/download/20260808_linux/XWAU2025_Linux.zip

  installer:
    - task:
        name: create_prefix
        prefix: $GAMEDIR
        arch: win64

    - task:
        name: winetricks
        prefix: $GAMEDIR
        app: corefonts consolas

    # Optional: same DPI tweak as in 01-xwainstallermanager.yml, uncomment
    # if the game's UI looks too small.
    # - task:
    #     name: set_regedit
    #     prefix: $GAMEDIR
    #     path: 'HKEY_CURRENT_USER\Control Panel\Desktop'
    #     key: LogPixels
    #     value: '112'
    #     type: REG_DWORD

    - extract:
        file: linux_patch_zip
        dst: $GAMEDIR/tftc_linux_patch

    # TFTC is confirmed to reuse the same Linux DLL wrapper as XWAU2025.
    # If XWAU2025_Linux.zip contains a single wrapping top-level folder
    # instead of the files directly, adjust the source path below to
    # match (e.g. "$GAMEDIR/tftc_linux_patch/<folder-name>/.").
    - execute:
        description: Copying the Linux DLL wrapper into your TFTC folder
        command: 'cp -rf "$GAMEDIR/tftc_linux_patch/." "$(dirname "$tftc_exe")/"'

  game:
    exe: $tftc_exe
    prefix: $GAMEDIR
    arch: win64

  wine:
    overrides:
      ddraw.dll: n,b
      dinput.dll: n,b
